<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedcloudje HQ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar box">
    <div class="brand">
      <span class="brand-logo" aria-hidden="true">◓</span>
      <span>FEEDCLOUDJE <small>HQ</small></span>
    </div>
    <div class="stats">
      <div class="stat" title="Speltijd"><span class="label">TIJD</span><span id="clock">DAG 1 08:30</span></div>
      <div class="stat" title="Verdien je met goedgekeurd werk, besteed je aan werven"><span class="label">CREDITS</span><span id="credits">0 ⛁</span></div>
      <div class="stat" title="Hoe goed de afgesloten omgeving dicht zit"><span class="label">FIREWALL</span>
        <span class="bar small"><span id="firewall-bar" class="fill"></span></span><span id="firewall">100%</span>
      </div>
      <div class="stat" title="Afgeronde projecten"><span class="label">PROJECTEN</span><span id="projects-done">0</span></div>
      <div class="stat" title="Taken goedgekeurd door Godfred"><span class="label">GOEDGEKEURD</span><span id="tasks-approved">0</span></div>
      <div class="stat" title="Taken die Godfred terugstuurde"><span class="label">REVISIES</span><span id="revisions">0</span></div>
      <div class="stat" title="Indringers tegengehouden bij de poort"><span class="label">GEBLOKT</span><span id="blocked">0</span></div>
    </div>
    <div class="controls">
      <button id="btn-pause" class="btn" title="Pauze (spatie)">❚❚</button>
      <button id="btn-speed" class="btn" title="Snelheid">1x</button>
      <button id="btn-meeting" class="btn" title="Roep iedereen bijeen in de vergaderzaal">VERGADER</button>
      <button id="btn-recruit" class="btn btn-accent" title="Nieuwe agent werven">+ WERVEN</button>
      <button id="btn-reset" class="btn btn-ghost" title="Opnieuw beginnen">↺</button>
    </div>
  </header>

  <main class="layout">
    <section class="world-col">
      <div class="world-frame box">
        <canvas id="world" aria-label="Plattegrond van de organisatie"></canvas>
      </div>

      <div class="dialog box" id="dialog" title="Klik om door te gaan">
        <p id="dialog-text"></p>
        <span class="dialog-arrow">▼</span>
      </div>
    </section>

    <aside class="side-col">
      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="team" role="tab">TEAM</button>
        <button class="tab" data-tab="board" role="tab">PRIKBORD <span class="badge" id="board-count">0</span></button>
        <button class="tab" data-tab="output" role="tab">OUTPUT</button>
        <button class="tab" data-tab="log" role="tab">LOG</button>
      </nav>

      <div class="panel box" id="tab-team">
        <div id="detail" class="detail hidden"></div>
        <ul id="team-list" class="team-list"></ul>
      </div>

      <div class="panel box hidden" id="tab-board">
        <form id="order-form" class="quest-form">
          <div class="form-title">OPDRACHT VAN DE BAAS AAN GODFRED</div>
          <input id="o-title" type="text" maxlength="50" placeholder="Bijv. Nieuwe website lanceren" required>
          <div class="form-row">
            <select id="o-dept" aria-label="Afdeling"></select>
            <select id="o-size" aria-label="Omvang">
              <option value="1">★</option><option value="2">★★</option><option value="3" selected>★★★</option>
              <option value="4">★★★★</option><option value="5">★★★★★</option>
            </select>
            <button class="btn btn-accent" type="submit">GEEF</button>
          </div>
        </form>
        <ul id="pipeline" class="quest-list"></ul>
      </div>

      <div class="panel box hidden" id="tab-output">
        <ul id="output-list" class="quest-list"></ul>
      </div>

      <div class="panel box hidden" id="tab-log">
        <ul id="log-list" class="log-list"></ul>
      </div>
    </aside>
  </main>

  <script src="js/map.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/brains.js"></script>
  <script src="js/org.js"></script>
  <script src="js/world.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
