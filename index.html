<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedcloudje HQ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar box">
    <div class="brand">
      <span class="brand-logo" aria-hidden="true">◓</span>
      <span>FEEDCLOUDJE <small>HQ</small></span>
    </div>
    <div class="stats">
      <div class="stat" title="Speltijd"><span class="label">TIJD</span><span id="clock">DAG 1 07:00</span></div>
      <div class="stat" title="Credits: verdien je met quests, besteed je aan werven"><span class="label">CREDITS</span><span id="credits">0 ⛁</span></div>
      <div class="stat" title="Hoe goed de afgesloten omgeving dicht zit"><span class="label">FIREWALL</span>
        <span class="bar small"><span id="firewall-bar" class="fill"></span></span><span id="firewall">100%</span>
      </div>
      <div class="stat"><span class="label">QUESTS</span><span id="quests-done">0</span></div>
      <div class="stat"><span class="label">BUGS</span><span id="bugs-beaten">0</span></div>
      <div class="stat"><span class="label">GEBLOKT</span><span id="blocked">0</span></div>
    </div>
    <div class="controls">
      <button id="btn-pause" class="btn" title="Pauze (spatie)">❚❚</button>
      <button id="btn-speed" class="btn" title="Snelheid">1x</button>
      <button id="btn-recruit" class="btn btn-accent" title="Nieuwe medewerker werven">+ WERVEN</button>
      <button id="btn-reset" class="btn btn-ghost" title="Opnieuw beginnen">↺</button>
    </div>
  </header>

  <main class="layout">
    <section class="world-col">
      <div class="world-frame box">
        <canvas id="world" aria-label="Kaart van de organisatie"></canvas>

        <div id="battle" class="battle hidden" aria-live="polite">
          <div class="battle-field">
            <div class="infobox enemy">
              <div class="row"><b id="b-enemy-name">BUG</b><span id="b-enemy-lvl">Lv1</span></div>
              <div class="row hp"><span class="hp-label">HP</span><span class="bar"><span id="b-enemy-hp" class="fill"></span></span></div>
            </div>
            <div class="mon enemy-mon"><div class="platform"></div><div id="b-enemy-sprite" class="mon-sprite"></div></div>
            <div class="mon ally-mon"><div class="platform"></div><div id="b-ally-sprite" class="mon-sprite"></div></div>
            <div class="infobox ally">
              <div class="row"><b id="b-ally-name">NAAM</b><span id="b-ally-lvl">Lv1</span></div>
              <div class="row hp"><span class="hp-label">HP</span><span class="bar"><span id="b-ally-hp" class="fill"></span></span></div>
              <div class="row num" id="b-ally-num">100/100</div>
            </div>
          </div>
          <div class="battle-text box" id="b-text">Een wilde BUG verscheen!</div>
        </div>
      </div>

      <div class="dialog box" id="dialog" title="Klik om door te gaan">
        <p id="dialog-text"></p>
        <span class="dialog-arrow">▼</span>
      </div>
    </section>

    <aside class="side-col">
      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="team" role="tab">TEAM</button>
        <button class="tab" data-tab="quests" role="tab">QUESTS</button>
        <button class="tab" data-tab="log" role="tab">LOGBOEK</button>
      </nav>

      <div class="panel box" id="tab-team">
        <div id="detail" class="detail hidden"></div>
        <ul id="team-list" class="team-list"></ul>
      </div>

      <div class="panel box hidden" id="tab-quests">
        <form id="quest-form" class="quest-form">
          <div class="form-title">NIEUWE OPDRACHT VAN DE BAAS</div>
          <input id="q-title" type="text" maxlength="40" placeholder="Bijv. Nieuwsbrief schrijven" required>
          <div class="form-row">
            <select id="q-dept" aria-label="Afdeling"></select>
            <select id="q-diff" aria-label="Moeilijkheid">
              <option value="1">★</option><option value="2" selected>★★</option><option value="3">★★★</option>
              <option value="4">★★★★</option><option value="5">★★★★★</option>
            </select>
            <button class="btn btn-accent" type="submit">GEEF</button>
          </div>
        </form>
        <ul id="quest-list" class="quest-list"></ul>
      </div>

      <div class="panel box hidden" id="tab-log">
        <ul id="log-list" class="log-list"></ul>
      </div>
    </aside>
  </main>

  <script src="js/map.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/org.js"></script>
  <script src="js/world.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
