# Profielkaart (laag 3) – Oppertet
# Gebaseerd op het profiel van Godfred (godfred/profile.md), vertaald naar de Tet Tet-structuur:
# afdelingshoofden = Hoofdtets, worker agents = Tets, Risk Fred = Risk & Safety, Elsje = HR en de Control Tets.
# Erft cultuur van cultuur-tet-tet. Mandaat kan rechten alleen inperken, nooit uitbreiden.
