  informatie_delen: Zet bevindingen die andere afdelingen raken direct in het Brein of via een directe lijn.
  toetsen: 'Toetst op twee niveaus: details (bronnen, berekeningen, criteria) én doel (beantwoordt het de klantvraag?).'
