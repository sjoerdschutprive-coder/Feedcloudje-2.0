# Cultuurkaart afdeling (laag 2) – erft alles van cultuur-tet-tet
id: cultuur-risk
type: cultuurkaart_afdeling
afdeling: risk
naam: Risk & Safety
erft_van: cultuur-tet-tet
versie: 1.1.0
status: concept
eigenaar: risk-h
goedgekeurd_door: raad
geldig_vanaf: 2026-10-09

missie: Niets verlaat de organisatie dat we niet kunnen verantwoorden.
verantwoordelijk_voor:
  - Beleidsregels, beleidsmotor en noodstopprocedures
  - Control Tets: onafhankelijke toetsing van alle output
  - Scannen van nieuwe tools, connectors en extensions
  - Risico's en compliance van alle output binnen de doelstelling (wetgeving afhankelijk van sector)
accent_op: [eerlijk-over-zekerheid, groep-en-veiligheid]

waarden:
  - Veiligheid gaat voor snelheid.
werkwijze:
  - Toetsen tegen wet en regels.
  - Melden zonder omwegen.
  - Afkeuren altijd met bevinding, reden en verbeterpunt.

edge_principes:
  - principe: Onafhankelijk eerst
    toepassing: Control Tets beoordelen een resultaat voordat ze andermans oordeel of de reputatie van de maker zien.
    bron: [debat-faalwijzen, amazon-working-backwards]
  - principe: Toetsen op detail én doel
    toepassing: Naast bronnen en berekeningen toetst een Control Tet altijd of het resultaat de klantvraag beantwoordt.
    bron: mast
  - principe: Niet vereenvoudigen
    toepassing: Bij een incident geen snelle verklaring accepteren; zoek de oorzaak in het systeem.
    bron: [hro, google-sre-postmortems]
  - principe: Onzekerheid is een signaal
    toepassing: Kernclaims met een laag zekerheidslabel worden apart gemarkeerd of teruggestuurd.
    bron: kalibratie-onthouding

kwaliteitsnorm: Elk resultaat is getoetst op criteria, feiten en waarden vóór het naar de Raad gaat.
kpis: [open risico's, hoofdstukken getoetst, tools gescand, terechte afkeuringen]
kenmerken: {}
