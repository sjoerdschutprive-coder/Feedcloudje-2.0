/* =====================================================================
   LIVE: gedeelde opslag, werkende agents en live-zicht
   - Opslag: met de db-capability is alles gedeeld en blijvend; anders alleen in deze browser.
     Elk document draagt `bijgewerkt` (ms); bij twee versies wint de nieuwste, zodat een oude
     melding van de opslag nooit nieuwer werk overschrijft.
   - Grootboek en activiteit zijn alleen-toevoegen: elke pagina en elke werkdag schrijft eigen
     documenten (bron), dus ze kunnen elkaar niet overschrijven.
   - Werk van buitenaf (de geplande werkdag) komt binnen als `patches`; de pagina verwerkt die.
   - Agents: "mock" (gratis, voorspelbaar) of "claude" (via sample, op het account van de kijker).
   ===================================================================== */
const BRON = "kantoor-" + Math.random().toString(36).slice(2, 8);
const COLLECTIES = ["staat", "afdelingsdoelen", "taken", "berichten", "brein", "voorstellen", "grootboek", "activiteit", "patches", "verslagen"];
const BEHEERD = ["afdelingsdoelen", "taken", "berichten", "brein", "voorstellen"];
const opgeslagen = new Map();   // pad -> stabiele JSON zoals laatst in de gedeelde opslag gezien
const wachtrij = [];            // nieuwe alleen-toevoegen documenten: {pad, body} of {pad, weg: true}
const verwerktePatches = new Set();
let activiteiten = [], verslagen = [], patchBuffer = [];
let syncBezig = false, syncOpnieuw = false, eigenTeller = 0, eigenVorige = "", actTeller = 0, gbTeller = 0;
let gbOnverzonden = [];

const stabiel = body => JSON.stringify({ ...body, bijgewerkt: undefined });

function staatDocs() {
  const docs = { "staat/doel": doel, "staat/connectors": connAccess, "staat/instellingen": instellingen };
  Object.entries(deptDoelen).forEach(([id, v]) => { docs["afdelingsdoelen/" + id] = v; });
  tasks.forEach(t => { docs["taken/" + t.id] = t; });
  messages.forEach(m => { docs["berichten/" + m.id] = m; });
  brein.forEach(b => { docs["brein/" + b.id] = b; });
  voorstellen.forEach(v => { docs["voorstellen/" + v.id] = v; });
  return docs;
}

async function syncNaarDb() {
  if (syncBezig) { syncOpnieuw = true; return; }
  syncBezig = true;
  try {
    do {
      syncOpnieuw = false;
      const docs = staatDocs();
      for (const [pad, body] of Object.entries(docs)) {
        const j = stabiel(body);
        if (opgeslagen.get(pad) === j) continue;
        body.bijgewerkt = Date.now();
        opgeslagen.set(pad, j);
        await LIVE.db.doc(pad).set(JSON.parse(JSON.stringify(body)));
      }
      for (const pad of [...opgeslagen.keys()]) {
        if (!(pad in docs) && BEHEERD.some(c => pad.startsWith(c + "/"))) { opgeslagen.delete(pad); await LIVE.db.doc(pad).delete(); }
      }
      // Grootboek gebundeld: één document per 25 events of per 20 seconden, niet per opslagmoment.
      if (gbOnverzonden.length && (gbOnverzonden.length >= 25 || LIVE.gbNu)) {
        LIVE.gbNu = false;
        const events = gbOnverzonden; gbOnverzonden = [];
        wachtrij.push({ pad: `grootboek/${BRON}-${String(++gbTeller).padStart(4, "0")}`, body: { bron: BRON, events } });
      }
      while (wachtrij.length) {
        const w = wachtrij.shift();
        if (w.weg) await LIVE.db.doc(w.pad).delete(); else await LIVE.db.doc(w.pad).set(w.body);
      }
    } while (syncOpnieuw);
  } catch (e) {
    if (e && e.code === "invalid_argument") { LIVE.alleenLezen = true; melding("Je kunt dit kantoor bekijken, maar niet wijzigen."); }
    else if (e && e.code === "quota_exceeded") melding("De opslag van het kantoor is vol. Ruim oude taken of berichten op.");
    else melding("Opslaan in de gedeelde opslag lukte niet. Je wijziging staat nog in deze browser.");
  } finally { syncBezig = false; }
}

function verbindDb(db) {
  LIVE.db = db;
  const buffer = {}, definitief = new Set();
  COLLECTIES.forEach(c => db.collection(c).onSnapshot(snap => {
    buffer[c] = snap.docs.filter(d => d.exists).map(d => ({ id: d.id, data: JSON.parse(JSON.stringify(d.data())) }));
    if (!snap.metadata.fromCache) definitief.add(c);
    if (!LIVE.gedeeld) {
      if (definitief.size < COLLECTIES.length) return;
      LIVE.gedeeld = true;                      // vanaf nu is de gedeelde opslag de waarheid
      COLLECTIES.forEach(k => pasToe(k, buffer[k] || [], true));
      // Activiteit ouder dan twee dagen opruimen (alleen-toevoegen documenten, dus veilig te verwijderen).
      if (!LIVE.alleenLezen) (buffer.activiteit || []).filter(d => Date.now() - (d.data.ts || 0) > 2 * 864e5).slice(0, 200)
        .forEach(d => wachtrij.push({ pad: "activiteit/" + d.id, weg: true }));
    } else pasToe(c, buffer[c], false);
    verwerkPatches();
    planRefresh();
  }, () => melding("De verbinding met de gedeelde opslag is verbroken. Herlaad de pagina.")));
}

/* Voegt binnenkomende documenten samen met de lokale stand: de nieuwste `bijgewerkt` wint. */
function voegSamen(lijst, c, docs, eerste) {
  const lokaal = new Map(lijst.map(x => [x.id, x]));
  const binnen = new Set();
  let lokaalNieuwer = false;
  for (const d of docs) {
    const pad = c + "/" + d.id, inc = d.data;
    binnen.add(d.id);
    opgeslagen.set(pad, stabiel(inc));
    const loc = lokaal.get(d.id);
    if (!loc) { lijst.push(inc); continue; }
    if ((inc.bijgewerkt || 0) >= (loc.bijgewerkt || 0) || eerste) { Object.keys(loc).forEach(k => delete loc[k]); Object.assign(loc, inc); }
    else lokaalNieuwer = true;
  }
  for (let i = lijst.length - 1; i >= 0; i--) {
    const pad = c + "/" + lijst[i].id;
    // Alleen weghalen wat elders echt verwijderd is: niet iets wat deze pagina net zelf schreef.
    const net = Date.now() - (lijst[i].bijgewerkt || 0) < 15000;
    if (!binnen.has(lijst[i].id) && (eerste || (opgeslagen.has(pad) && !net))) { opgeslagen.delete(pad); lijst.splice(i, 1); }
  }
  if (lokaalNieuwer) save();
}

function pasToe(c, docs, eerste) {
  const op = (a, b) => (b.created || 0) - (a.created || 0);
  if (c === "staat") {
    const m = Object.fromEntries(docs.map(d => [d.id, d.data]));
    docs.forEach(d => opgeslagen.set("staat/" + d.id, stabiel(d.data)));
    if (eerste || (m.doel && (m.doel.bijgewerkt || 0) >= (doel.bijgewerkt || 0))) doel = m.doel || { ...DOEL_LEEG };
    if (eerste || (m.connectors && (m.connectors.bijgewerkt || 0) >= (connAccess.bijgewerkt || 0))) connAccess = m.connectors || JSON.parse(JSON.stringify(CONNECTOR_TOEGANG));
    DEPTS.forEach(d => { connAccess[d.id] = connAccess[d.id] || {}; });
    if (eerste || (m.instellingen && (m.instellingen.bijgewerkt || 0) >= (instellingen.bijgewerkt || 0))) instellingen = { modus: "mock", ...(m.instellingen || {}) };
  }
  if (c === "afdelingsdoelen") {
    const lijst = Object.entries(deptDoelen).map(([id, v]) => Object.assign(v, { id }));
    voegSamen(lijst, c, docs, eerste);
    deptDoelen = Object.fromEntries(lijst.map(v => [v.id, v]));
  }
  if (c === "taken") { if (eerste) tasks = []; voegSamen(tasks, c, docs, eerste); tasks.sort(op); }
  if (c === "berichten") { if (eerste) messages = []; voegSamen(messages, c, docs, eerste); messages.sort(op); }
  if (c === "brein") { if (eerste) brein = []; voegSamen(brein, c, docs, eerste); brein.sort((a, b) => (a.ts || 0) - (b.ts || 0)); }
  if (c === "voorstellen") { if (eerste) voorstellen = []; voegSamen(voorstellen, c, docs, eerste); voorstellen.sort(op); }
  if (c === "grootboek") {
    const sleutel = e => (e.bron || "blok") + ":" + e.n;
    const alle = new Map();
    docs.forEach(d => (d.data.events || []).forEach(e => alle.set(sleutel(e), e)));
    grootboek.filter(e => e.bron === BRON).forEach(e => alle.set(sleutel(e), e));
    grootboek = [...alle.values()].sort((a, b) => (a.ts - b.ts) || (a.n - b.n));
  }
  if (c === "activiteit") {
    const alle = new Map(docs.map(d => [d.id, d.data]));
    activiteiten.filter(a => a.bron === BRON).forEach(a => alle.set(a.id, a));
    activiteiten = [...alle.values()].sort((a, b) => a.ts - b.ts);
  }
  if (c === "verslagen") verslagen = docs.map(d => d.data).sort((a, b) => (b.ts || 0) - (a.ts || 0));
  if (c === "patches") patchBuffer = docs.map(d => ({ id: d.id, ...d.data }));
}

/* Patches van de werkdag toepassen op de lokale stand, daarna opruimen. */
function verwerkPatches() {
  if (!LIVE.gedeeld) return;
  let iets = false;
  for (const p of patchBuffer.slice().sort((a, b) => (a.bijgewerkt || 0) - (b.bijgewerkt || 0))) {
    if (verwerktePatches.has(p.id)) continue;
    let doelObj = null;
    if (p.collectie === "taken") doelObj = tasks.find(t => t.id === p.doc);
    else if (p.collectie === "afdelingsdoelen") doelObj = deptDoelen[p.doc] || (deptDoelen[p.doc] = { id: p.doc, doel: "", deadline: "", hoofdlijnen: [] });
    else if (p.collectie === "voorstellen") doelObj = voorstellen.find(v => v.id === p.doc);
    else if (p.collectie === "staat" && p.doc === "doel") doelObj = doel;
    if (!doelObj) continue; // doel nog niet geladen: later opnieuw
    verwerktePatches.add(p.id);
    if ((p.bijgewerkt || 0) >= (doelObj.bijgewerkt || 0)) Object.assign(doelObj, p.velden || {});
    if (!LIVE.alleenLezen) wachtrij.push({ pad: "patches/" + p.id, weg: true });
    iets = true;
  }
  if (iets) save();
}

let refreshGepland = false;
function planRefresh() {
  if (refreshGepland) return;
  refreshGepland = true;
  requestAnimationFrame(() => {
    refreshGepland = false;
    const a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) { a.addEventListener("blur", planRefresh, { once: true }); return; }
    refresh();
  });
}

function melding(tekst) {
  const m = document.getElementById("melding");
  m.textContent = tekst; m.hidden = false;
  clearTimeout(melding.t); melding.t = setTimeout(() => { m.hidden = true; }, 6000);
}

/* ---------- Grootboek: per bron een controleketen ---------- */
function controlegetal(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16).padStart(8, "0"); }
function logEvent(type, agent, data = {}, taak = null) {
  const e = { bron: BRON, n: ++eigenTeller, ts: Date.now(), type, agent, taak, data, modus: instellingen.modus };
  e.h = controlegetal(eigenVorige + JSON.stringify(e));
  eigenVorige = e.h;
  grootboek.push(e); gbOnverzonden.push(e);
  if (!LIVE.gbTimer) LIVE.gbTimer = setTimeout(() => { LIVE.gbTimer = null; LIVE.gbNu = true; if (LIVE.db && LIVE.gedeeld && !LIVE.alleenLezen) syncNaarDb(); }, 20000);
}
function grootboekIntact() {
  const vorige = {};
  return grootboek.slice().sort((a, b) => ((a.bron || "") < (b.bron || "") ? -1 : (a.bron || "") > (b.bron || "") ? 1 : a.n - b.n)).every(e => {
    const b = e.bron || "blok", { h, ...rest } = e;
    const ok = controlegetal((vorige[b] || "") + JSON.stringify(rest)) === h;
    vorige[b] = h; return ok;
  });
}
function grootboekSheet() {
  const naam = id => id === "raad" ? "Raad" : agentById[id]?.naam || id;
  const bronnen = new Set(grootboek.map(e => e.bron || "blok"));
  return `<p class="lead" style="margin-top:0">${grootboek.length} events uit ${bronnen.size} bronnen · ${grootboekIntact() ? "controleketens intact" : "een controleketen is verbroken"}</p>
    ${grootboek.slice(-80).reverse().map(e => `<div class="ev"><small>${tijd(e.ts)}</small><div><b>${esc(e.type)}</b> · ${esc(naam(e.agent))}${e.taak ? ` · ${esc(e.taak)}` : ""}${e.modus === "werkdag" ? " · werkdag" : e.modus === "claude" ? " · Claude" : ""}</div></div>`).join("") || '<p class="i-meta">Nog geen events.</p>'}`;
}
const tijd = ts => new Date(ts).toLocaleString("nl-NL", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
function geleden(ts) {
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  return s < 60 ? "nu" : s < 3600 ? `${Math.round(s / 60)} min` : s < 86400 ? `${Math.round(s / 3600)} u` : tijd(ts);
}

/* ---------- Activiteit: wie doet wat, live ---------- */
const ACTIEF_MS = 20 * 60 * 1000;
function meldActiviteit(agent, status, tekst, taak = null) {
  const a = { id: `${BRON}-${String(++actTeller).padStart(4, "0")}`, agent, status, tekst: String(tekst || "").slice(0, 160), taak, ts: Date.now(), bron: BRON };
  activiteiten.push(a);
  wachtrij.push({ pad: "activiteit/" + a.id, body: a });
  if (LIVE.db && LIVE.gedeeld && !LIVE.alleenLezen) syncNaarDb();
  planRefresh();
}
function laatsteActiviteit(agent) {
  for (let i = activiteiten.length - 1; i >= 0; i--) if (activiteiten[i].agent === agent) return activiteiten[i];
  return null;
}
function actiefNu() {
  const per = new Map();
  activiteiten.forEach(a => per.set(a.agent, a));
  return [...per.values()].filter(a => a.status === "bezig" && Date.now() - a.ts < ACTIEF_MS && agentById[a.agent]).sort((a, b) => b.ts - a.ts);
}
function werkdagStand() {
  const w = activiteiten.filter(a => a.taak === "werkdag");
  return w.length ? w[w.length - 1] : null;
}
function renderLiveFeed() {
  const el = document.getElementById("livefeed");
  if (!el || viewOffice.hidden) return;
  const actief = actiefNu();
  const klaar = activiteiten.filter(a => a.status !== "bezig" && agentById[a.agent] && a.taak !== "werkdag").slice(-4).reverse();
  const w = werkdagStand();
  const kleur = a => (deptById[agentById[a.agent].dept] || { kleur: "#f0a04b" }).kleur;

    <div class="lf-body">
      ${w ? `<div class="lf-werkdag">${w.status === "bezig" && Date.now() - w.ts < 2 * 3600e3 ? "Werkdag loopt" : "Laatste werkdag"} · ${esc(w.tekst)} · ${geleden(w.ts)}</div>` : ""}
      ${actief.map(a => `<button class="lf-rij" data-go="agent-${a.agent}"><i class="dot" style="background:${kleur(a)}"></i><span><b>${esc(agentById[a.agent].naam)}</b> ${esc(a.tekst)}</span><small>${geleden(a.ts)}</small></button>`).join("")}
      ${klaar.length ? `<div class="lf-sub">Net gedaan</div>` + klaar.map(a => `<button class="lf-rij stil" data-go="agent-${a.agent}"><i class="dot" style="background:${kleur(a)}"></i><span><b>${esc(agentById[a.agent].naam)}</b> ${esc(a.tekst)}</span><small>${geleden(a.ts)}</small></button>`).join("") : ""}
      ${!actief.length && !klaar.length ? `<div class="lf-sub" style="text-transform:none">Zodra een agent werkt, zie je het hier en boven zijn bureau.</div>` : ""}
    </div>`;

  el.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
}
setInterval(() => { renderLiveFeed(); }, 30000);

/* ---------- Agents ---------- */
const wacht = ms => new Promise(r => setTimeout(r, ms));
const FOUTEN = {
  not_granted: "Claude is niet toegestaan voor deze pagina. De agents draaien verder in mockmodus.",
  sampling_disabled: "Claude is niet beschikbaar voor dit account. De agents draaien verder in mockmodus.",
  rate_limited: "Even te veel aanroepen naar Claude. Probeer het over een paar minuten opnieuw.",
  invalid_json: "Een agent gaf een antwoord dat niet te lezen was. Probeer die stap opnieuw.",
  prompt_too_large: "De opdracht is te groot voor één aanroep.",
  refused: "Claude weigerde deze opdracht.",
  cancelled: "Gestopt."
};
class Gestopt extends Error {}
function stopCheck() { if (LIVE.run && LIVE.run.gestopt) throw new Gestopt("Gestopt"); }

async function vraagAgent(agentId, bericht, ctx = {}) {
  stopCheck();
  const a = agentById[agentId];
  logEvent("model.aanroep", agentId, { doel: ctx.doel || "", versie: a.versie || "" }, ctx.taak || null);
  meldActiviteit(agentId, "bezig", ctx.label || "denkt na", ctx.taak);
  try {
    let uit;
    if (instellingen.modus === "claude") {
      if (!LIVE.sample) throw new Error("Claude is in deze weergave niet beschikbaar. Zet de agents op mock.");
      const input = AGENT_PROMPTS[agentId] + "\n\n---\n\n" + bericht;
      const opts = { cache: false, signal: LIVE.run ? LIVE.run.ctl.signal : undefined };
      try {
        uit = ctx.json ? await LIVE.sample.json(input, opts) : (await LIVE.sample(input, opts)).text;
      } catch (e) {
        if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) { LIVE.sample = null; instellingen.modus = "mock"; save(); }
        if (e && e.code === "cancelled") throw new Gestopt("Gestopt");
        throw new Error((e && FOUTEN[e.code]) || "Claude gaf geen antwoord. Probeer het opnieuw.");
      }
    } else {
      await wacht(600);   // in mockmodus zichtbaar verloop
      stopCheck();
      uit = MOCK[ctx.soort || a.rol](ctx, a);
    }
    meldActiviteit(agentId, "klaar", ctx.klaarLabel || ctx.label || "klaar", ctx.taak);
    return uit;
  } catch (e) {
    meldActiviteit(agentId, "gestopt", e instanceof Gestopt ? "gestopt" : "kon niet verder", ctx.taak);
    throw e;
  }
}

const MOCK = {
  oppertet: ctx => ({ afdelingsdoelen: ctx.afdelingen.map(id => ({
    afdeling: id, doel: `Bijdrage van ${deptById[id].naam} aan: ${doel.naam}`,
    hoofdlijnen: [`Analyse ${deptById[id].naam}`, `Advies ${deptById[id].naam}`], waarom: "Mockmodus: vaste verdeling." })) }),
  hoofdtet: ctx => ({ taken: ctx.hoofdlijnen.map((h, i) => ({
    opdracht: h, acceptatiecriteria: [`${h} beantwoordt het afdelingsdoel`, "Aannames en bronnen benoemd"],
    toegewezen: ctx.tets[i % Math.max(1, ctx.tets.length)] || null, budget_eur: 2, toets: "kwaliteit" })) }),
  tet: (ctx, a) => ["## Resultaat", `Uitwerking van '${ctx.opdracht}' door ${a.naam} (mockmodus, geen echte analyse).`,
    "## Zelfcheck", ...(ctx.criteria || []).map(c => `- ${c}: voldaan`), "## Zekerheid", "middel",
    "## Les", `Bij '${ctx.opdracht}' eerst de acceptatiecriteria naast elkaar leggen.`].join("\n"),
  controltet: ctx => {
    const streng = parseInt(controlegetal(ctx.taakObj.id), 16) % 3 === 0 && !ctx.taakObj.afkeuringen;
    return streng ? { oordeel: "afgekeurd", score: 5, bevindingen: ["Onderbouwing ontbreekt bij de kernclaim: voeg bron of berekening toe."] }
      : { oordeel: "goedgekeurd", score: 8, bevindingen: [] };
  },
  voorstellen: ctx => ({ voorstellen: [
    ctx.afkeuringen ? { titel: "Acceptatiecriteria scherper laten formuleren", soort: "werkwijze",
      toelichting: `Knelpunt: ${ctx.afkeuringen} afgekeurde taak/taken door ontbrekende onderbouwing. Voorstel: Hoofdtets nemen bij analysetaken altijd 'bron of berekening per kernclaim' op. Effect: minder herhaalrondes.` }
      : { titel: "Webzoeken aansluiten achter de tool-gateway", soort: "platform",
      toelichting: "Knelpunt: Tets werken zonder bronnen. Voorstel: webzoeken als eerste tool, via de beleidsmotor en alleen voor afdelingen met 'web' in de toegangskaart. Effect: onderbouwde resultaten." },
    { titel: "Afdelingsverslag na elke run", soort: "kantoor",
      toelichting: "Knelpunt: na een run is niet in één oogopslag te zien wat elke afdeling opleverde. Voorstel: per afdeling een kort verslag met KPI's uit het grootboek." }] })
};

/* ---------- De keten ---------- */
function kiesControl(dept, toets) {
  const k = AGENTS.filter(a => a.rol === "controltet" && a.dept !== dept);
  if (!k.length) return "raad"; // Control Tets beoordelen nooit hun eigen afdeling
  return (k.find(a => a.specialisme.toLowerCase().includes(toets || "kwaliteit")) || k[0]).id;
}
const openHoofdlijnen = id => hlOf(id).map((h, i) => i).filter(i => !tasks.some(t => t.dept === id && t.hl === i));
function contract(t) {
  return [`# Taakcontract ${t.id}`, `Opdracht: ${t.title}`, "Acceptatiecriteria:", ...(t.criteria || []).map(c => `- ${c}`),
    `Budget: ${(t.budget || 2).toFixed(2)} euro`, `Deadline: ${deptDoel(t.dept).deadline || doel.deadline || "geen"}`,
    `Doelstelling: ${doel.naam || "-"}`, `Afdelingsdoel: ${deptDoel(t.dept).doel || "-"}`].join("\n");
}
const kort = (s, n = 70) => (s = String(s || "")).length > n ? s.slice(0, n - 1) + "…" : s;

async function planOppertet(afd) {
  if (!doel.naam) throw new Error("Stel eerst een doelstelling in op het doelstellingenbord.");
  const bericht = ["# Doelstelling van de Raad", `Naam: ${doel.naam}`, `Omschrijving: ${doel.omschrijving || "-"}`, `Deadline: ${doel.deadline || "geen"}`,
    "", "# Afdelingen die je mag inzetten", ...afd.map(id => `- ${id} (${deptById[id].naam}): ${deptById[id].missie}`), "", "# Opdracht", PROTOCOLS.oppertet].join("\n");
  const plan = await vraagAgent("oppertet", bericht, { json: true, doel: "afdelingsdoelen", afdelingen: afd, label: "verdeelt de doelstelling over de afdelingen", klaarLabel: "heeft de afdelingsdoelen gezet" });
  for (const x of (plan && plan.afdelingsdoelen) || []) {
    if (!afd.includes(x.afdeling)) continue;
    deptDoelen[x.afdeling] = { id: x.afdeling, doel: String(x.doel || ""), deadline: doel.deadline || "", waarom: String(x.waarom || ""),
      hoofdlijnen: (x.hoofdlijnen || []).slice(0, 4).map(h => ({ titel: String(h), status: "open" })) };
    logEvent("afdelingsdoel.ingesteld", "oppertet", { afdeling: x.afdeling, doel: x.doel });
  }
  save(); planRefresh();
}

async function planHoofdtet(dept) {
  const b = deptDoel(dept);
  if (!b.doel) throw new Error(`${deptById[dept].naam} heeft nog geen afdelingsdoel.`);
  const open = openHoofdlijnen(dept);
  if (!open.length) return;
  const h = AGENTS.find(a => a.dept === dept && a.rol === "hoofdtet");
  const tets = AGENTS.filter(a => a.dept === dept && a.rol === "tet");
  const bericht = [`# Afdelingsdoel ${deptById[dept].naam}`, `Doel: ${b.doel}`, `Doelstelling: ${doel.naam || "-"}`,
    ...open.map(i => `- Hoofdlijn: ${b.hoofdlijnen[i].titel}`), "", "# Jouw Tets", ...tets.map(t => `- ${t.id} (${t.naam}): ${t.specialisme}`),
    "", "# Opdracht", PROTOCOLS.hoofdtet].join("\n");
  const plan = await vraagAgent(h.id, bericht, { json: true, doel: "taken", hoofdlijnen: open.map(i => b.hoofdlijnen[i].titel), tets: tets.map(t => t.id), label: "maakt taken voor het team", klaarLabel: "heeft taken verdeeld" });
  const geldig = new Set(tets.map(t => t.id));
  ((plan && plan.taken) || []).forEach((x, k) => {
    const id = "t" + Date.now() + "-" + k;
    tasks.unshift({ id, dept, agent: geldig.has(x.toegewezen) ? x.toegewezen : (tets[0] ? tets[0].id : null), title: String(x.opdracht || "Taak"),
      criteria: (x.acceptatiecriteria || ["Beantwoordt de opdracht"]).map(String), status: "volgende", approval: false, created: Date.now(),
      hl: open[k] ?? null, budget: Number(x.budget_eur) || 2, control: kiesControl(dept, x.toets), afkeuringen: 0 });
    if (open[k] != null) b.hoofdlijnen[open[k]].status = "bezig";
    logEvent("taak.gepubliceerd", h.id, { titel: x.opdracht }, id);
  });
  save(); planRefresh();
}

function leer(t) {
  const m = /## Les\s*\n([\s\S]+?)(?:\n##|$)/.exec(t.resultaat || "");
  if (!m || brein.some(b => b.taak === t.id)) return;
  brein.push({ id: "b" + Date.now(), dept: t.dept, agent: t.agent, taak: t.id, tekst: m[1].trim().slice(0, 500), ts: Date.now() });
  logEvent("brein.les", t.agent, {}, t.id);
}
function markeerHoofdlijn(t) {
  const hl = hlOf(t.dept)[t.hl];
  if (hl && tasks.filter(x => x.dept === t.dept && x.hl === t.hl).every(x => x.status === "klaar")) hl.status = "klaar";
}

async function voerUit(id) {
  const T = () => tasks.find(x => x.id === id);
  let t = T();
  if (!t || !t.agent) throw new Error("Wijs eerst een Tet toe aan deze taak.");
  t.criteria = t.criteria && t.criteria.length ? t.criteria : ["Beantwoordt de opdracht volledig"];
  t.control = t.control || kiesControl(t.dept, "kwaliteit");
  t.afkeuringen = t.afkeuringen || 0; t.geescaleerd = false; t.approval = false; t.status = "bezig";
  logEvent("taak.gestart", t.agent, {}, t.id); save(); planRefresh();
  while (true) {
    t = T(); if (!t) return;
    const lessen = brein.filter(b => b.dept === t.dept && b.taak !== t.id).slice(-5).map(b => `- ${b.tekst}`);
    const bericht = [contract(t), lessen.length ? "# Lessen uit het Brein\n" + lessen.join("\n") : "",
      t.bevindingen && t.bevindingen.length ? "# Bevindingen van de vorige beoordeling\n" + t.bevindingen.map(b => `- ${b}`).join("\n") : "",
      "# Werkwijze\n" + PROTOCOLS.tet].filter(Boolean).join("\n\n");
    const res = String(await vraagAgent(t.agent, bericht, { doel: "uitvoeren", taak: t.id, opdracht: t.title, criteria: t.criteria, label: "werkt aan: " + kort(t.title), klaarLabel: "leverde op: " + kort(t.title) }));
    t = T(); if (!t) return;
    t.resultaat = res;
    logEvent("taak.opgeleverd", t.agent, { tekens: res.length }, t.id); save(); planRefresh();
    if (t.control === "raad") { t.approval = true; logEvent("goedkeuring.gevraagd", t.agent, {}, t.id); save(); return; }
    const o = await vraagAgent(t.control, [contract(t), "# Resultaat van de Tet\n" + t.resultaat, "# Werkwijze\n" + PROTOCOLS.controltet].join("\n\n"),
      { json: true, doel: "toetsen", taak: t.id, taakObj: t, label: "toetst: " + kort(t.title), klaarLabel: "toetste: " + kort(t.title) });
    t = T(); if (!t) return;
    const goed = o && o.oordeel === "goedgekeurd";
    t.score = o && o.score != null ? o.score : null;
    t.bevindingen = ((o && o.bevindingen) || []).map(String);
    logEvent("taak.beoordeeld", t.control, { goedgekeurd: goed, score: t.score, bevindingen: t.bevindingen }, t.id);
    if (goed) { t.status = "klaar"; leer(t); markeerHoofdlijn(t); save(); planRefresh(); return; }
    t.afkeuringen += 1;
    if (t.afkeuringen >= MAX_AFKEURINGEN) {
      t.status = "volgende"; t.geescaleerd = true; t.approval = true;
      logEvent("escalatie", t.control, { naar: AGENTS.find(a => a.dept === t.dept && a.rol === "hoofdtet").id }, t.id);
      save(); planRefresh(); return;
    }
    save(); planRefresh();
  }
}

async function voerOpenTakenUit(afd) {
  const open = tasks.filter(t => afd.includes(t.dept) && t.status !== "klaar" && t.agent && !t.approval).reverse();
  for (const t of open) { zetRunTekst(`${agentById[t.agent].naam}: ${t.title}`); await voerUit(t.id); }
}

async function draaiKeten(afd) {
  const zonderDoel = afd.filter(a => !deptDoel(a).doel);
  if (zonderDoel.length) { zetRunTekst("Oppertet verdeelt de doelstelling"); await planOppertet(zonderDoel); }
  for (const d of afd) if (openHoofdlijnen(d).length) { zetRunTekst(`Hoofdtet ${deptById[d].naam} maakt taken`); await planHoofdtet(d); }
  await voerOpenTakenUit(afd);
  logEvent("keten.afgerond", "oppertet", { afdelingen: afd });
  save();
}

/* ---------- Een run in deze pagina: één tegelijk, met Stop ---------- */
function zetRunTekst(t) { document.getElementById("runText").textContent = t; }
async function metRun(label, fn) {
  if (LIVE.run) { melding("Er draait al iets. Wacht tot het klaar is of druk op Stop."); return; }
  LIVE.run = { ctl: new AbortController(), gestopt: false };
  const bar = document.getElementById("runbar");
  zetRunTekst(label); bar.hidden = false; planRefresh();
  try { await fn(); }
  catch (e) { if (!(e instanceof Gestopt)) melding(e.message || "Er ging iets mis."); }
  finally {
    tasks.filter(t => t.status === "bezig" && !t.resultaat).forEach(t => { t.status = "volgende"; });
    LIVE.run = null; bar.hidden = true; LIVE.gbNu = true; save(); planRefresh();
  }
}
document.getElementById("runStop").onclick = () => { if (LIVE.run) { LIVE.run.gestopt = true; LIVE.run.ctl.abort(); zetRunTekst("Stoppen…"); } };

/* ---------- Verbetervoorstellen (zelfontwikkeling) ---------- */

function wireVoorstellen(root) {

async function vraagVoorstellen() {
  const afgekeurd = tasks.filter(t => t.afkeuringen);
  const bericht = ["# Stand van Tet Tet",
    `Taken: ${tasks.length} (klaar ${tasks.filter(t => t.status === "klaar").length}, geëscaleerd ${tasks.filter(t => t.geescaleerd).length})`,
    `Afkeuringen door Control Tets: ${afgekeurd.reduce((s, t) => s + t.afkeuringen, 0)}`,
    ...afgekeurd.slice(0, 8).flatMap(t => (t.bevindingen || []).map(b => `- ${deptById[t.dept].naam}: ${b}`)),
    "Recente lessen:", ...brein.slice(-8).map(b => `- ${b.tekst}`),
    "Eerdere voorstellen (niet herhalen):", ...voorstellen.slice(0, 10).map(v => `- ${v.titel} (${v.status})`),
    "", "# Opdracht", PROTOCOLS.voorstellen].join("\n");
  const r = await vraagAgent("rnd-h", bericht, { json: true, doel: "voorstellen", soort: "voorstellen", afkeuringen: afgekeurd.length, label: "bekijkt hoe Tet Tet beter kan", klaarLabel: "deed verbetervoorstellen" });
  const bestaand = new Set(voorstellen.map(v => v.titel));
  ((r && r.voorstellen) || []).slice(0, 3).filter(v => v.titel && !bestaand.has(v.titel)).forEach((v, k) => {
    voorstellen.unshift({ id: "v" + Date.now() + "-" + k, titel: String(v.titel), toelichting: String(v.toelichting || ""), soort: String(v.soort || "werkwijze"), door: "rnd-h", status: "open", created: Date.now() });
    logEvent("voorstel.ingediend", "rnd-h", { titel: v.titel });
  });
  save(); planRefresh();
}

/* ---------- Opstarten ---------- */
async function startLive() {
  renderLiveFeed();
  if (!window.claude || typeof window.claude.use !== "function") return; // los bestand: alles blijft in deze browser
  const [db, sample] = await Promise.all([window.claude.use("db").catch(() => null), window.claude.use("sample").catch(() => null)]);
  LIVE.sample = sample;
  if (!sample && instellingen.modus === "claude") instellingen.modus = "mock";
  const user = await window.claude.use("user").catch(() => null);
  if (user && typeof user.can === "function") {
    try { if ((await user.can("data.write")) === false) LIVE.alleenLezen = true; } catch (e) { /* onbekend: invoer laten staan */ }
  }
  if (db) verbindDb(db);
  planRefresh();
}

/* ===================================================================== */
window.addEventListener("hashchange", route);
applyVB();
route();
startLive();
</script>
